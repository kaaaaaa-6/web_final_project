<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>期末專題首頁</title>

  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px 50px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      text-align: center;
      width: 350px;
    }

    h1 {
      margin-bottom: 25px;
      font-size: 24px;
      color: #333;
    }

    .menu {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .menu li {
      margin: 15px 0;
    }

    .menu a {
      display: block;
      padding: 12px 20px;
      background: #007bff;
      color: white;
      border-radius: 8px;
      font-size: 18px;
      text-decoration: none;
      transition: 0.25s;
    }

    .menu a:hover {
      background: #0056c7;
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
  </style>

</head>

<body>

  <div class="container">
    <h1>客戶訂餐管理系統</h1>

    <ul class="menu">
      <li><a href="customers.html">客戶管理</a></li>
      <li><a href="orders.html">訂單管理</a></li>
    </ul>
  </div>

</body>
</html>
