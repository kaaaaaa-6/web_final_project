<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>客戶管理</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  :root {
      --bg-color: #f5f7fa;
      --container-bg: white;
      --text-color: #333;
      --link-bg: #007bff;
      --link-hover: #0056c7;
      --btn-toggle-bg: #6c757d;
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --container-bg: #2d2d2d;
      --text-color: #f5f7fa;
      --link-bg: #375a7f;
      --link-hover: #2b4764;
      --btn-toggle-bg: #f39c12; 
    }

  body {
    font-family: "Microsoft JhengHei", sans-serif;
    /* background: #f5f7fa; */
    background: var(--bg-color);
    color: var(--text-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 900px;
    margin-top: 40px;
    /* background: white; */
    background: var(--container-bg);
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  }

  h1 h2{
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
    /* color: #333; */
    color: var(--text-color);
  }

  a {
    color: #0066cc;
    text-decoration: none;
  }
  a:hover {
    text-decoration: underline;
  }

  /* h2 {
    margin-top: 30px;
    color: #333;
  } */

  /* 表單 */
  label {
    display: inline-block;
    width: 120px;
    margin: 6px 0;
    font-weight: bold;
  }

  input[type="text"] {
    width: 260px;
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: var(--container-bg); 
    color: var(--text-color);      
  }
  [data-theme="dark"] input[type="text"] {
    border-color: #555;
  }

  input[type="submit"], button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: #007bff;
    color: white;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.25s;
  }

  input[type="submit"]:hover,
  button:hover {
    background: #005ecb;
    transform: translateY(-2px);
  }

  #cancelEditBtn {
    background: #6c757d;
  }
  #cancelEditBtn:hover {
    background: #5a6268;
  }

  /* 系統訊息 */
  .msg-success { color: green; }
  .msg-error { color: red; }
  .msg-info { color: #555; }

  /* 表格 */
  table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 20px;
    font-size: 15px;
  }

  th {
    background: #007bff;
    color: white;
    padding: 10px;
    cursor: pointer;
    user-select: none;
  }
  th:hover {
    background: #0056b3;
  }

  td {
    border-bottom: 1px solid #ddd;
    padding: 8px;
    text-align: center;
    color: var(--text-color);
  }
  [data-theme="dark"] td {
    border-bottom: 1px solid #444; 
  }

  tr:hover {
    /* background: #f1f5ff; */
    background: rgba(0, 123, 255, 0.1);
  }

  /* Active / Inactive 按鈕列（預留 UI，JS 之後再加） */
  .filter-buttons {
    margin-top: 10px;
  }
  .filter-buttons button {
    background: #17a2b8;
  }
  .filter-buttons button:hover {
    background: #138496;
  }
</style>

</head>

<body>

<div class="container">

  <h1>客戶管理</h1>
  <p><a href="index.html">回首頁</a></p>
  <button id="themeToggle" style="margin-bottom: 20px; padding: 5px 10px; cursor: pointer;">
    <i class="fa-regular fa-moon"></i>模式切換
  </button>

  <h2>新增 / 修改客戶</h2>

  <form id="customerForm">
    <div>
      <label for="idNumber">身分證字號：</label>
      <input type="text" id="idNumber" required />
    </div>
    <div>
      <label for="customerName">姓名：</label>
      <input type="text" id="customerName" required />
    </div>
    <div>
      <label for="phone">電話：</label>
      <input type="text" id="phone" />
    </div>
    <div>
      <label for="address">地址：</label>
      <input type="text" id="address" />
    </div>
    <div class="btn">
      <input type="submit" id="submitBtn" value="新增客戶" />
      <button type="button" id="cancelEditBtn" style="display:none;">取消編輯</button>
    </div>
  </form>

  <p id="customerMessage"></p>

  <h2>客戶列表</h2>
  <div style="margin-top: 10px; margin-bottom: 5px;">
    <label for="customerSearch" style="width:auto;font-weight:normal;">查詢客戶：</label>
    <input type="text" id="customerSearch" placeholder="輸入身分證或姓名關鍵字" style="width:240px;padding:6px;">
    <button type="button" id="customerSearchBtn">查詢</button>
    <button type="button" id="customerSearchClearBtn">清除</button>
  </div>
  <!-- 未來 JS 會用的「Active / Inactive」切換按鈕 -->
  <div class="filter-buttons">
    <button type="button" class="filter-btn" data-filter="Active">顯示 Active</button>
    <button type="button" class="filter-btn" data-filter="Inactive">顯示 Inactive</button>
    <button type="button" class="filter-btn" data-filter="All">顯示全部</button>
  </div>

  <table>
    <thead>
      <tr>
        <th onclick="handleSort('IDNumber')">身分證 <i class="fa-solid fa-sort"></i></th>
        <th onclick="handleSort('CustomerName')">姓名 <i class="fa-solid fa-sort"></i></th>
        <th onclick="handleSort('Phone')">電話 <i class="fa-solid fa-sort"></i></th>
        <th>地址</th>
        <th onclick="handleSort('RegistrationDate')">註冊日期 <i class="fa-solid fa-sort"></i></th>
        <th>狀態</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="customerTableBody"></tbody>
  </table>

</div>
  <script>
    const htmlEl = document.documentElement;
    let customersData = [];
    let editingCustomerId = null;
    let currentFilter = "Active";
    let customerKeyword = "";  
    let sortConfig = { key: 'RegistrationDate', direction: 'desc' }; 

    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        const currentTheme = htmlEl.getAttribute('data-theme');
        if (currentTheme === 'dark') {
          htmlEl.removeAttribute('data-theme');
          localStorage.setItem('theme', 'light');
        } else {
          htmlEl.setAttribute('data-theme', 'dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    }
    syncTheme();

    function syncTheme() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark') {
      htmlEl.setAttribute('data-theme', 'dark');
    } else {
      htmlEl.removeAttribute('data-theme');
    }
  }

    function showCustomerMessage(text, type) {
      const msg = document.getElementById("customerMessage");
      msg.textContent = text;
      msg.className = "";
      if (type === "success") msg.classList.add("msg-success");
      else if (type === "error") msg.classList.add("msg-error");
      else if (type === "info") msg.classList.add("msg-info");
    }

    function resetCustomerForm() {
      document.getElementById("customerForm").reset();
      document.getElementById("idNumber").readOnly = false;
      document.getElementById("submitBtn").value = "新增客戶";
      document.getElementById("cancelEditBtn").style.display = "none";
      editingCustomerId = null;
    }

    function loadCustomers() {
      fetch("/api/customers")
        .then(res => res.json())
        .then(data => {
        //   customersData = data;
          customersData = data || [];
          renderCustomerTable();
          updateFilterButtons();
          if (!editingCustomerId) {
            showCustomerMessage("", "info");
          }
        })
        .catch(err => {
          console.error(err);
          showCustomerMessage("載入客戶資料失敗", "error");
        });
    }
    function updateFilterButtons() {
    document.querySelectorAll(".filter-btn").forEach(btn => {
      if (btn.dataset.filter === currentFilter) {
        btn.classList.add("active");
      } else {
        btn.classList.remove("active");
      }
    });
  }

 function renderCustomerTable() {
    const tbody = document.getElementById("customerTableBody");
    tbody.innerHTML = "";

    let sortedData = [...customersData]; 
      sortedData.sort((a, b) => {
        let valA = a[sortConfig.key] || "";
        let valB = b[sortConfig.key] || "";
        
        // 數字或字串比較
        if (valA < valB) return sortConfig.direction === 'asc' ? -1 : 1;
        if (valA > valB) return sortConfig.direction === 'asc' ? 1 : -1;
        return 0;
      });

    const kw = customerKeyword.trim().toLowerCase();

    sortedData.forEach((c) => { 
      // 篩選狀態
      if (currentFilter !== "All" && c.ConsumptionStatus !== currentFilter) {
        return; 
      }
      // 關鍵字搜尋
      if (kw !== "") {
        const idLower = (c.IDNumber || "").toLowerCase();
        const nameLower = (c.CustomerName || "").toLowerCase();
        if (!idLower.includes(kw) && !nameLower.includes(kw)) {
          return;
        }
      }

      const tr = document.createElement("tr");
      const regDate = c.RegistrationDate
        ? new Date(c.RegistrationDate).toISOString().slice(0, 10)
        : "";

      tr.innerHTML = `
        <td>${c.IDNumber}</td>
        <td>${c.CustomerName}</td>
        <td>${c.Phone || ""}</td>
        <td>${c.Address || ""}</td>
        <td>${regDate}</td>
        <td>${c.ConsumptionStatus || ""}</td>
        <td>
          <button type="button" onclick="startEditById('${c.IDNumber}')">編輯</button>
          ${c.ConsumptionStatus === "Active"
            ? `<button type="button" onclick="deleteCustomer('${c.IDNumber}')">刪除</button>`
            : ""}
          ${c.ConsumptionStatus === "Inactive"
            ? `<button type="button" onclick="activateCustomer('${c.IDNumber}')">啟用</button>`
            : ""}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function handleSort(key) {
      if (sortConfig.key === key) {
        sortConfig.direction = sortConfig.direction === 'asc' ? 'desc' : 'asc';
      } else {
        sortConfig.key = key;
        sortConfig.direction = 'asc';
      }
      renderCustomerTable();
  }



    // 綁定篩選按鈕事件
    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
        currentFilter = btn.dataset.filter;
        updateFilterButtons();
        renderCustomerTable();
        });
    });
    function activateCustomer(id) {
    if (!confirm(`確定要將 ${id} 的狀態改成 Active？`)) return;

    fetch("/api/customers/status", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ idnumber: id, status: "Active" }),
    })
        .then(res => res.json())
        .then(res => {
        if (res.error) {
            showCustomerMessage(res.error, "error");
        } else {
            showCustomerMessage("狀態已啟用", "success");
            loadCustomers();
        }
        })
        .catch(err => {
        console.error(err);
        showCustomerMessage("更新客戶狀態失敗", "error");
        });
    }


    function deleteCustomer(idNumber) {
  if (!confirm("確定要刪除此客戶？身分證：" + idNumber + "（若已有訂單紀錄將無法刪除）")) {
    return;
  }

  fetch("/api/customers/delete?id=" + encodeURIComponent(idNumber), {
    method: "DELETE",
  })
    .then(res => res.json())
    .then(res => {
      if (res.error) {
        showCustomerMessage(res.error, "error");
      } else {
        showCustomerMessage("刪除客戶成功", "success");
        // 如果剛好在編輯這個人，也順便重置表單
        if (editingCustomerId === idNumber) {
          resetCustomerForm();
        }
        loadCustomers();
      }
    })
    .catch(err => {
      console.error(err);
      showCustomerMessage("刪除客戶失敗", "error");
    });
}   
    function startEditCustomer(index) {
      const c = customersData[index];
      editingCustomerId = c.IDNumber;

      document.getElementById("idNumber").value = c.IDNumber;
      document.getElementById("idNumber").readOnly = true; // PK 不讓改
      document.getElementById("customerName").value = c.CustomerName || "";
      document.getElementById("phone").value = c.Phone || "";
      document.getElementById("address").value = c.Address || "";

      document.getElementById("submitBtn").value = "儲存修改";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      showCustomerMessage("正在編輯客戶：" + c.IDNumber, "info");
    }

    document.getElementById("cancelEditBtn").addEventListener("click", () => {
      resetCustomerForm();
      showCustomerMessage("已取消編輯", "info");
    });

    document.getElementById("customerForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const payload = {
        idnumber: document.getElementById("idNumber").value.trim(),
        customerName: document.getElementById("customerName").value.trim(),
        phone: document.getElementById("phone").value.trim(),
        address: document.getElementById("address").value.trim(),
      };

      if (!payload.idnumber || !payload.customerName) {
        showCustomerMessage("身分證字號與姓名必填", "error");
        return;
      }

      if (!editingCustomerId) {
        // 新增
        fetch("/api/customers", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then(res => res.json())
          .then(res => {
            if (res.error) {
              showCustomerMessage(res.error, "error");
            } else {
              showCustomerMessage("新增客戶成功", "success");
              resetCustomerForm();
              loadCustomers();
            }
          })
          .catch(err => {
            console.error(err);
            showCustomerMessage("新增客戶失敗", "error");
          });
      } else {
        // 修改
        fetch("/api/customers/update", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        })
          .then(res => res.json())
          .then(res => {
            if (res.error) {
              showCustomerMessage(res.error, "error");
            } else {
              showCustomerMessage("修改客戶成功", "success");
              resetCustomerForm();
              loadCustomers();
            }
          })
          .catch(err => {
            console.error(err);
            showCustomerMessage("修改客戶失敗", "error");
          });
      }
    });
    // 綁定查詢事件
    document.getElementById("customerSearchBtn").addEventListener("click", () => {
    customerKeyword = document.getElementById("customerSearch").value;
    renderCustomerTable();
    });

    document.getElementById("customerSearchClearBtn").addEventListener("click", () => {
    customerKeyword = "";
    document.getElementById("customerSearch").value = "";
    renderCustomerTable();
    });


    window.addEventListener("load", loadCustomers);
  </script>
</body>
</html>
